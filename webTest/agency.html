<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CleanTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --g:#00c896;--gd:#00a07a;--gl:#e0faf3;--gll:#f0fdf9;
  --r:#ff4d4d;--rl:#fff0f0;--am:#f59e0b;--aml:#fffbeb;
  --bl:#3b82f6;--bll:#eff6ff;--pu:#7c3aed;--pul:#f3f0ff;
  --mrt:#0ea5e9;--park:#22c55e;--cvs:#f97316;--pub:#7c3aed;--gas:#ef4444;--temple:#b45309;
  --ink:#0d1117;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;
  --ln:#e5e7eb;--ln2:#f3f4f6;--surf:#fff;
  --rr:14px;--r2:10px;--r3:8px;
  --ff:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --sh:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:var(--ff);background:#ecf0f4;color:var(--ink);max-width:430px;margin:0 auto;min-height:100vh;}

/* SHELL */
.shell{display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:72px;}
.page::-webkit-scrollbar{display:none;}

/* BOTTOM NAV */
.bnav{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--surf);border-top:1px solid var(--ln);display:flex;align-items:center;z-index:50;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 4px;color:var(--ink4);transition:color .15s;position:relative;}
.bn.on{color:var(--gd);}
.bn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.bn span{font-size:10px;font-weight:500;}
.bn-red{width:7px;height:7px;background:var(--r);border-radius:50%;position:absolute;top:6px;right:calc(50% - 16px);}

/* TOPBAR */
.topbar{background:var(--surf);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tb-l{display:flex;align-items:center;gap:10px;}
.tb-logo{width:30px;height:30px;border-radius:9px;background:var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tb-name{font-size:14px;font-weight:600;}
.tb-sub{font-size:11px;color:var(--ink3);margin-top:1px;}
.tb-r{display:flex;align-items:center;gap:6px;}
.online-pill{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--gl);color:var(--gd);}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--g);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.lang-btn{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;border:1px solid var(--ln);background:var(--ln2);color:var(--ink3);cursor:pointer;font-family:var(--ff);}

/* CAT FILTER */
.cat-bar{display:flex;gap:6px;padding:8px 14px 6px;overflow-x:auto;flex-shrink:0;}
.cat-bar::-webkit-scrollbar{display:none;}
.cf{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--ln);background:var(--surf);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:var(--ff);transition:all .15s;}
.cf.act-mrt{background:#e0f2fe;border-color:#38bdf8;color:#0369a1;}
.cf.act-park{background:#dcfce7;border-color:#4ade80;color:#15803d;}
.cf.act-cvs{background:#fff7ed;border-color:#fb923c;color:#c2410c;}
.cf.act-pub{background:var(--pul);border-color:#a78bfa;color:var(--pu);}
.cf.act-gas{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;}
.cf.act-temple{background:#fef3c7;border-color:#fcd34d;color:#92400e;}
.ci{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700;flex-shrink:0;}
.ci-mrt{background:var(--mrt);}
.ci-park{background:var(--park);}
.ci-cvs{background:var(--cvs);border-radius:4px;}
.ci-pub{background:var(--pub);border-radius:3px;}
.ci-gas{background:var(--gas);border-radius:4px;}
.ci-temple{background:var(--temple);border-radius:50%;}

/* URGENT BANNER */
.urg-banner{margin:8px 14px 0;background:var(--rl);border:1px solid #fecaca;border-radius:var(--rr);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.ub-icon{width:34px;height:34px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ub-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;}
.ub-body{flex:1;}
.ub-tag{font-size:10px;font-weight:700;color:var(--r);text-transform:uppercase;letter-spacing:.06em;}
.ub-title{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px;}
.ub-meta{font-size:11px;color:var(--ink3);margin-top:1px;}
.ub-arr{font-size:16px;color:var(--r);align-self:center;}

/* SH */
.sh{padding:13px 14px 7px;display:flex;align-items:center;justify-content:space-between;}
.sh-t{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;}
.sh-r{font-size:11px;color:var(--gd);font-weight:500;cursor:pointer;}

/* SCHEDULE */
.sched{padding:0 14px;display:flex;flex-direction:column;gap:0;}
.sched-item{display:flex;gap:0;position:relative;}
.sched-line{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0;padding-top:12px;}
.sched-dot{width:22px;height:22px;border-radius:50%;border:2.5px solid currentColor;background:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;z-index:1;}
.sched-dot.dot-done{background:var(--ln2);border-color:var(--ln);color:var(--ink4);}
.sched-dot.dot-active{background:var(--g);border-color:var(--g);color:#fff;}
.sched-dot.dot-urgent{background:var(--r);border-color:var(--r);color:#fff;}
.sched-dot.dot-todo{background:#fff;border-color:var(--ln);color:var(--ink4);}
.sched-dash{flex:1;width:0;border-left:2px dashed var(--ln);margin:3px 0 0;min-height:16px;}
.sched-dash.dash-done{border-color:#d1d5db;}
.sched-dash.dash-active{border-color:var(--g);opacity:.5;}
.sched-card{flex:1;padding:10px 12px 10px 8px;margin-bottom:6px;}
.sc{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rr);padding:11px 12px;display:flex;gap:11px;cursor:pointer;transition:box-shadow .15s;}
.sc:hover{box-shadow:var(--sh);}
.sc.active{border-color:var(--g);background:var(--gll);}
.sc.done{opacity:.5;}
.sc-t{min-width:44px;text-align:center;}
.sc-tv{font-size:13px;font-weight:600;font-family:var(--fm);color:var(--gd);}
.sc.done .sc-tv{color:var(--ink4);}
.sc-tl{font-size:9px;color:var(--ink4);margin-top:2px;}
.sc-div{width:1px;background:var(--ln);flex-shrink:0;}
.sc-body{flex:1;}
.sc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.sc-loc{font-size:11px;color:var(--ink3);margin-top:2px;}
.sc-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.tg{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;}
.tg-g{background:var(--gl);color:var(--gd);}
.tg-r{background:var(--rl);color:var(--r);}
.tg-a{background:var(--aml);color:#92400e;}
.tg-b{background:var(--bll);color:#1d4ed8;}
.tg-gr{background:var(--ln2);color:var(--ink3);}
.tg-p{background:var(--pul);color:var(--pu);}
.sc-rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.cb{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}
.cb-mrt{background:var(--mrt);}
.cb-park{background:var(--park);}
.cb-cvs{background:var(--cvs);border-radius:3px;}
.cb-pub{background:var(--pub);border-radius:2px;}
.cb-gas{background:var(--gas);border-radius:3px;}
.cb-temple{background:var(--temple);border-radius:50%;}

/* MAP */
.mw{margin:0 14px;border-radius:var(--rr);overflow:hidden;border:1px solid var(--ln);}
#hmap{height:calc(100vw - 28px);max-height:402px;width:100%;}
#fmap{height:calc(100dvh - 232px);min-height:320px;width:100%;}
.mleg{padding:7px 14px;display:flex;gap:10px;flex-wrap:wrap;}
.ml{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink3);}
.mldot{width:9px;height:9px;border-radius:50%;}
.mlsq{width:9px;height:9px;border-radius:2px;}

/* MAP STOP STRIP */
.map-stops-hdr{padding:8px 14px 4px;display:flex;align-items:center;justify-content:space-between;}
.map-stop-strip{display:flex;gap:8px;padding:4px 14px 14px;overflow-x:auto;flex-shrink:0;}
.map-stop-strip::-webkit-scrollbar{display:none;}
.msc{flex-shrink:0;width:130px;background:var(--surf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 10px 9px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:5px;}
.msc:hover{box-shadow:var(--sh);}
.msc.msc-active{border-color:var(--g);background:var(--gll);}
.msc.msc-urgent{border-color:var(--r);background:var(--rl);}
.msc.msc-done{opacity:.45;}
.msc-top{display:flex;align-items:center;justify-content:space-between;}
.msc-letter{font-size:13px;font-weight:700;font-family:var(--fm);}
.msc-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;}
.msc-name{font-size:11px;font-weight:600;color:var(--ink);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.msc-info{font-size:10px;color:var(--ink3);display:flex;align-items:center;gap:3px;}
.msc-cat{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:700;flex-shrink:0;}
.steps{display:flex;padding:10px 14px;align-items:center;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.sn{width:21px;height:21px;border-radius:50%;border:2px solid var(--ln);background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;z-index:1;transition:all .2s;}
.sn.done{background:var(--g);border-color:var(--g);color:#fff;}
.sn.act{background:var(--bl);border-color:var(--bl);color:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.2);}
.sl{font-size:9px;color:var(--ink4);margin-top:3px;text-align:center;}
.step::before{content:'';position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--ln);z-index:0;}
.step:first-child::before{display:none;}
.step.done::before,.step.done+.step::before{background:var(--g);}

/* CHECKIN */
.cin-btn{width:100%;padding:11px;border:2px dashed var(--g);border-radius:var(--r2);background:var(--gll);color:var(--gd);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;font-family:var(--ff);}
.cin-btn.done{border-style:solid;background:var(--g);color:#fff;}

/* CHECKLIST */
.clist{display:flex;flex-direction:column;gap:5px;}
.cli{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surf);border:1px solid var(--ln);border-radius:var(--r2);cursor:pointer;}
.cli.done{background:var(--gll);border-color:var(--gl);}
.cbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ln);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cli.done .cbox{background:var(--g);border-color:var(--g);}
.cli.done .cbox::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.ct{font-size:12px;flex:1;}
.cli.done .ct{color:var(--ink4);text-decoration:line-through;}

/* ANOMALY CHIPS */
.anom-chips{display:flex;flex-wrap:wrap;gap:5px;}
.ac{padding:5px 11px;border:1.5px solid var(--ln);border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;background:var(--surf);transition:all .15s;font-family:var(--ff);}
.ac.on{border-color:var(--r);background:var(--rl);color:var(--r);}
.anom-note{width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--ln);border-radius:var(--r2);font-size:12px;font-family:var(--ff);color:var(--ink);background:var(--surf);resize:none;outline:none;transition:border-color .15s;}
.anom-note:focus{border-color:var(--g);}
.anom-note::placeholder{color:var(--ink4);}

/* PHOTO */
.pgrid{display:flex;gap:7px;flex-wrap:wrap;}
.pthumb{width:70px;height:70px;border-radius:var(--r2);border:1.5px dashed var(--ln);background:var(--gll);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:border-color .15s;}
.pthumb.filled{background:var(--ln2);border-style:solid;}
.pthumb:hover{border-color:var(--g);}
.pthumb svg{width:20px;height:20px;stroke:var(--g);fill:none;stroke-width:1.8;}
.pthumb.filled svg{stroke:var(--gd);}
.pnum{font-size:9px;color:var(--ink3);}

/* PROG */
.pbg{background:var(--ln2);height:5px;border-radius:3px;overflow:hidden;}
.pf{height:5px;background:var(--g);border-radius:3px;transition:width .3s;}

/* SUBMIT */
.sub-btn{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--rr);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;}
.sub-btn:active{transform:scale(.98);}

/* STATS */
.sgrid{margin:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.scard{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rr);padding:13px;}
.snum{font-size:24px;font-weight:600;color:var(--gd);font-family:var(--fm);}
.slbl{font-size:11px;color:var(--ink3);margin-top:3px;font-weight:500;}
.ssub{font-size:10px;color:var(--ink4);margin-top:2px;}
.barwrap{margin:0 14px;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rr);padding:13px;}
.bars{display:flex;align-items:flex-end;gap:4px;height:55px;}
.bar{flex:1;background:var(--gl);border-radius:3px 3px 0 0;transition:background .15s;}
.bar:hover,.bar.cur{background:var(--g);}
.blbl{text-align:center;font-size:9px;color:var(--ink4);margin-top:3px;}
.hlist{margin:0 14px;display:flex;flex-direction:column;gap:5px;}
.hi{background:var(--surf);border:1px solid var(--ln);border-radius:var(--r2);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;}
.hn{font-size:12px;font-weight:500;}
.hm{font-size:10px;color:var(--ink3);margin-top:2px;}
.ht{font-size:13px;font-weight:600;color:var(--gd);font-family:var(--fm);}

/* PROFILE */
.phero{margin:14px;background:linear-gradient(135deg,var(--gd),var(--g));border-radius:var(--rr);padding:18px;color:#fff;}
.pav{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid rgba(255,255,255,.35);}
.pn{font-size:17px;font-weight:600;margin-top:9px;}
.pr{font-size:11px;opacity:.8;margin-top:2px;}
.pbs{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.pb{padding:3px 9px;background:rgba(255,255,255,.2);border-radius:20px;font-size:10px;font-weight:500;}
.icard{margin:0 14px 10px;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rr);overflow:hidden;}
.irow{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-bottom:1px solid var(--ln);}
.irow:last-child{border-bottom:none;}
.ilbl{font-size:11px;color:var(--ink3);}
.ival{font-size:12px;font-weight:500;}

/* ===== URGENT SHEET ===== */
.uo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:800;align-items:flex-end;justify-content:center;}
.uo.open{display:flex;animation:fadeUp .22s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.uo-s{background:var(--surf);border-radius:18px 18px 0 0;width:100%;max-width:430px;padding:18px 18px 28px;max-height:88%;overflow-y:auto;position:relative;}
.uo-s::-webkit-scrollbar{display:none;}
.uo-handle{width:34px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto 14px;}
.uo-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--r);background:var(--rl);padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.uo-crow{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.uo-title{font-size:17px;font-weight:700;}
.uo-addr{font-size:11px;color:var(--ink3);margin-top:2px;margin-bottom:12px;}
.uo-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px;}
.uom{background:var(--ln2);border-radius:var(--r2);padding:9px;text-align:center;}
.uomv{font-size:15px;font-weight:700;font-family:var(--fm);}
.uomv.d{color:var(--r);}
.uomv.w{color:var(--am);}
.uomv.ok{color:var(--gd);}
.uoml{font-size:9px;color:var(--ink3);margin-top:2px;}
#umap{height:calc(100vw - 28px);max-height:340px;border-radius:var(--rr);overflow:hidden;margin-bottom:12px;}
.uo-iss{background:var(--aml);border-left:3px solid var(--am);border-radius:0 var(--r3) var(--r3) 0;padding:9px 11px;font-size:11px;color:#92400e;margin-bottom:14px;}
.uo-acts{display:flex;gap:7px;}
.uo-acc{flex:2;padding:12px;background:var(--g);color:#fff;border:none;border-radius:var(--rr);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);}
.uo-dec{flex:1;padding:12px;background:var(--ln2);color:var(--ink3);border:none;border-radius:var(--rr);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--ff);}

/* ===== FLOW OVERLAY (within app) ===== */
.flow{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--surf);z-index:600;flex-direction:column;overflow:hidden;}
.flow.open{display:flex;}
.flow-hdr{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:9px;flex-shrink:0;background:var(--surf);}
.fbk{width:32px;height:32px;border-radius:50%;background:var(--ln2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.fbk svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ftitle{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* NAV MODE: map fills remaining space, nav card floats on bottom */
.flow-map-wrap{position:relative;}
.flow-map-wrap.nav-mode{flex:1;min-height:0;}
.flow-map-wrap.work-mode{flex-shrink:0;height:220px;}
#fmmap{width:100%;height:100%;}
.flow-map-wrap.work-mode #fmmap{height:220px;}
/* floating bottom card over map */
.flow-nav-card{position:absolute;bottom:0;left:0;right:0;background:var(--surf);border-radius:18px 18px 0 0;box-shadow:0 -2px 20px rgba(0,0,0,.15);padding:14px 14px 12px;z-index:10;}
/* WORK MODE: scrollable section below map */
.flow-body{flex:1;overflow-y:auto;min-height:0;}
.flow-body::-webkit-scrollbar{display:none;}
.rbar{display:flex;gap:8px;margin-bottom:10px;}
.rbi{flex:1;text-align:center;}
.rbv{font-size:15px;font-weight:700;font-family:var(--fm);color:var(--gd);}
.rbl{font-size:9px;color:var(--ink3);margin-top:1px;}
.gmb{width:100%;padding:10px;background:var(--bl);color:#fff;border:none;border-radius:var(--rr);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ff);display:flex;align-items:center;justify-content:center;gap:5px;margin-top:4px;}
.sec{padding:0 14px;}

/* COMPLETE */
.co{display:none;position:fixed;inset:0;background:var(--gd);z-index:900;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;}
.co.open{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.co-c{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;}
.co-c svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.co-title{color:#fff;font-size:22px;font-weight:700;}
.co-sub{color:rgba(255,255,255,.75);font-size:12px;text-align:center;line-height:1.6;}
.co-pts{background:rgba(255,255,255,.15);padding:9px 22px;border-radius:20px;color:#fff;font-size:13px;font-weight:600;}
.co-btn{padding:13px 30px;background:#fff;color:var(--gd);border:none;border-radius:var(--rr);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ff);}

/* NEXT URGENT SNACK */
.nub{display:none;position:absolute;bottom:70px;left:10px;right:10px;background:var(--ink);color:#fff;border-radius:var(--rr);padding:11px 14px;z-index:180;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.nub.show{display:flex;align-items:center;gap:9px;animation:slideUp .3s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.nub-body{flex:1;}
.nub-t{font-size:12px;font-weight:600;}
.nub-s{font-size:10px;color:rgba(255,255,255,.65);margin-top:2px;}
.nub-btn{padding:5px 11px;background:var(--r);border-radius:7px;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}

/* TOAST */
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;z-index:999;white-space:nowrap;display:none;pointer-events:none;}
.toast.show{display:block;animation:ta 2.5s ease forwards;}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(-4px)}10%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
</style>
</head>

function renderCatBar(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML='';
  const cats=[
    {key:'mrt',icon:'ci ci-mrt',lbl:'cat_mrt'},
    {key:'park',icon:'ci ci-park',lbl:'cat_park'},
    {key:'cvs',icon:'ci ci-cvs',lbl:'cat_cvs'},
    {key:'pub',icon:'ci ci-pub',lbl:'cat_pub'},
    {key:'gas',icon:'ci ci-gas',lbl:'cat_gas'},
    {key:'temple',icon:'ci ci-temple',lbl:'cat_temple'},
  ];
  cats.forEach(c=>{
    const btn=document.createElement('div');
    btn.className='cf '+(activeCats.has(c.key)?`act-${c.key}`:'');
    btn.dataset.cat=c.key;
    btn.innerHTML=`<div class="${c.icon}">${CAT_ICON[c.key]}</div>${T(c.lbl)}`;
    btn.onclick=()=>{
      activeCats.has(c.key)?activeCats.delete(c.key):activeCats.add(c.key);
      updateMapVis();
      renderCatBar('h-catbar');
      renderCatBar('m-catbar');
    };
    el.appendChild(btn);
  });
}

function initInaviMaps(){
  inaviReady=!!window.inavi?.maps?.Map;
  inaviLoading=false;
  if(!inaviReady){
    toast('iNavi map SDK is not ready');
    return;
  }
  const q=[...inaviQueue];
  inaviQueue=[];
  q.forEach(fn=>fn());
}
window.initInaviMaps=initInaviMaps;
window.initMap=initInaviMaps;

function ensureInaviReady(fn){
  if(window.inavi?.maps?.Map){
    inaviReady=true;
    fn();
    return;
  }
  inaviQueue.push(fn);
  if(inaviLoading) return;
  inaviLoading=true;
  const script=document.createElement('script');
  script.id='inavi-map-sdk';
  script.async=true;
  script.src=`https://gmaps.inavi.com/v1/sdk/web/${encodeURIComponent(INAVI_APP_KEY)}?callback=initMap`;
  script.onerror=()=>{inaviLoading=false;toast('iNavi map SDK load failed');};
  document.head.appendChild(script);
}

function makeInfo(content,position){
  if(!window.inavi?.maps?.InfoWindow) return null;
  return new inavi.maps.InfoWindow({position,content});
}

function addMarker(map,position,icon,infoContent,open=false){
  const marker=new inavi.maps.Marker({map,position});
  if(icon) marker.setIcon(icon);
  const info=infoContent?makeInfo(infoContent,position):null;
  if(info){
    marker.setInfoWindow?.(info);
    marker.on?.('click',()=>info.setMap(map));
    if(open) info.setMap(map);
  }
  return {marker,info};
}

function addPolyline(map,path,color,weight=2,opacity=.6,dashArray=''){
  const style=makeLineStyle(color,weight,opacity,dashArray);
  const line=new inavi.maps.Polyline({
    map,
    path,
    style,
  });
  return line;
}

function makeLineStyle(color,weight=2,opacity=.6,dashArray=''){
  const lineDasharray=Array.isArray(dashArray)
    ?dashArray
    :String(dashArray).split(/\s+/).filter(Boolean).map(Number).filter(Number.isFinite);
  const style={
    lineColor:color,
    lineWidth:weight,
    lineOpacity:opacity,
  };
  if(lineDasharray.length>=2) style.lineDasharray=lineDasharray.slice(0,2);
  return style;
}

function clearLayerRefs(refs){
  refs.forEach(item=>{
    try{item.info?.setMap();}catch(e){}
    try{item.marker?.setMap();}catch(e){}
    try{item.line?.setMap();}catch(e){}
  });
  refs.length=0;
}

function extractRouteCoordinates(data){
  if(Array.isArray(data.coordinates)) return data.coordinates;
  if(data.routes?.coordinates) return data.routes.coordinates;
  if(Array.isArray(data.routes)&&data.routes[0]?.coordinates) return data.routes[0].coordinates;
  if(data.geometry?.coordinates) return data.geometry.coordinates;
  return null;
}

function extractRouteStats(data){
  const r=Array.isArray(data.routes)?data.routes[0]:data.routes;
  return r||{};
}

function fitMap(map,points,zoomFallback){
  if(points.length>1 && map.fitCoordinates){
    map.fitCoordinates(points,{padding:28,duration:0});
    return;
  }
  if(points[0]) map.setCenter?.(points[0]);
  if(zoomFallback!=null) map.setZoom?.(zoomFallback);
}

async function fetchRoute(fromLat,fromLng,toLat,toLng){
  try{
    const url=`https://gmaps.inavi.com/maps/v3.0/appkeys/${encodeURIComponent(INAVI_APP_KEY)}/route-normal-tw`;
    const body={startX:String(fromLng),startY:String(fromLat),endX:String(toLng),endY:String(toLat),traffic:1};
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const text=await res.text();
    let data; try{data=JSON.parse(text);}catch(e){return null;}
    if(!res.ok) return null;
    const coords=extractRouteCoordinates(data);
    if(!coords?.length) return null;
    const points=coords.filter(c=>Array.isArray(c)&&Number.isFinite(Number(c[0]))&&Number.isFinite(Number(c[1]))).map(c=>[Number(c[0]),Number(c[1])]);
    return points.length?points:null;
  }catch(e){return null;}
}

async function drawHomeRoutes(m){
  const ordered=[...TASKS].sort((a,b)=>{
    const rank={done:0,active:1,urgent:2,todo:3};
    return (rank[a.status]??3)-(rank[b.status]??3);
  });

  const doneTasks=ordered.filter(t=>t.status==='done');
  const activeTask=ordered.find(t=>t.status==='active');
  const todoTasks=ordered.filter(t=>t.status==='todo'||t.status==='urgent');

  const segments=[];
  for(let i=0;i<doneTasks.length-1;i++){
    segments.push({fLat:doneTasks[i].lat,fLng:doneTasks[i].lng,tLat:doneTasks[i+1].lat,tLng:doneTasks[i+1].lng,style:'done',
      fallback:[[doneTasks[i].lng,doneTasks[i].lat],[doneTasks[i+1].lng,doneTasks[i+1].lat]]});
  }
  if(doneTasks.length&&activeTask){
    const last=doneTasks[doneTasks.length-1];
    segments.push({fLat:last.lat,fLng:last.lng,tLat:activeTask.lat,tLng:activeTask.lng,style:'done',
      fallback:[[last.lng,last.lat],[activeTask.lng,activeTask.lat]]});
  }
  if(activeTask){
    segments.push({fLat:ME[0],fLng:ME[1],tLat:activeTask.lat,tLng:activeTask.lng,style:'active',
      fallback:[[ME[1],ME[0]],[activeTask.lng,activeTask.lat]]});
  }
  if(activeTask&&todoTasks.length){
    segments.push({fLat:activeTask.lat,fLng:activeTask.lng,tLat:todoTasks[0].lat,tLng:todoTasks[0].lng,style:'future',
      fallback:[[activeTask.lng,activeTask.lat],[todoTasks[0].lng,todoTasks[0].lat]]});
  }
  for(let i=0;i<todoTasks.length-1;i++){
    segments.push({fLat:todoTasks[i].lat,fLng:todoTasks[i].lng,tLat:todoTasks[i+1].lat,tLng:todoTasks[i+1].lng,style:'future',
      fallback:[[todoTasks[i].lng,todoTasks[i].lat],[todoTasks[i+1].lng,todoTasks[i+1].lat]]});
  }

  const results=await Promise.all(segments.map(seg=>fetchRoute(seg.fLat,seg.fLng,seg.tLat,seg.tLng)));

  // make sure map still exists
  if(!maps.home) return;

  results.forEach((points,i)=>{
    const pts=points||segments[i].fallback; // use straight line fallback if API failed
    if(!pts?.length) return;
    const style=segments[i].style;
    if(style==='done'){
      addPolyline(m,pts,'#9ca3af',3,.55);
    } else if(style==='active'){
      addPolyline(m,pts,'#3b82f6',7,.18);
      addPolyline(m,pts,'#3b82f6',3.5,.95);
    } else {
      addPolyline(m,pts,'#f97316',3,.7,'6 5');
    }
  });
}

/* ============================================================

============================================================ */
function renderAnomChips(){
  const el=document.getElementById('anomChips');
  if(!el) return;
  const keys=['anom_1','anom_2','anom_3','anom_4','anom_5','anom_6','anom_7','anom_8'];
  const onStates=Array.from(el.querySelectorAll('.ac.on')).map(c=>c.dataset.key);
  el.innerHTML='';
  keys.forEach(k=>{
    const d=document.createElement('div');
    d.className='ac'+(onStates.includes(k)?' on':'');
    d.dataset.key=k;
    d.textContent=T(k);
    d.onclick=function(){this.classList.toggle('on');};
    el.appendChild(d);
  });
}

function renderFlowLabels(){
  const ids={sl1:'step_accept',sl2:'step_route',sl3:'step_checkin',sl4:'step_work',sl5:'step_finish'};
  Object.entries(ids).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.textContent=T(key);});
  const cin=document.getElementById('cinTxt');
  if(cin&&!checkinDone) cin.textContent=T('arrive_checkin');
  const gm=document.getElementById('gmbTxt');if(gm) gm.textContent=T('gmaps');
  const fl=document.getElementById('fDistL');if(fl) fl.textContent=T('dist');
  const fe=document.getElementById('fEtaL');if(fe) fe.textContent=T('eta_label');
  const fs=document.getElementById('fSlaL');if(fs) fs.textContent=T('sla_label');
  const cl=document.getElementById('clTitle');if(cl) cl.textContent=T('checklist_title');
  const pt=document.getElementById('photoTitle');if(pt) pt.textContent=T('photo_title');
  const at=document.getElementById('anomTitle');if(at) at.textContent=T('anom_title');
  const pl=document.getElementById('progLbl');if(pl) pl.textContent=T('progress');
  const sb=document.getElementById('subTxt');if(sb) sb.textContent=T('submit');
  const pa=document.getElementById('photoAddLbl');if(pa) pa.textContent=T('photo_add');
  document.getElementById('anomNote').placeholder=T('anom_note');
  // checklist item texts
  const clTexts={
    restock_f:{zh:'補充衛生紙（女廁 3 間）',en:'Restock paper – female ×3'},
    restock_m:{zh:'補充衛生紙（男廁 2 間）',en:'Restock paper – male ×2'},
    restock_soap:{zh:'補充洗手乳',en:'Refill hand soap'},
    clean_floor:{zh:'清潔地板與洗手台',en:'Clean floors & sinks'},
    check_sensor:{zh:'確認感測器恢復正常',en:'Verify sensor status'},
  };

    const v=clTexts[el.dataset.key];
    if(v) el.textContent=v[lang];
  });
  document.querySelectorAll('#fclist .tg[data-key]').forEach(el=>{
    const k=el.dataset.key;
    if(T(k)) el.textContent=T(k);
  });

function openFlow(taskId){
  const task=TASKS[taskId];
  currentTask=task;
  checkinDone=false; flowCheckCount=0; flowPhotoCount=0;
  startTime=new Date();
  document.getElementById('fTitle').textContent=task.name[lang];
  document.getElementById('fSub').textContent=(task.dist||'')+' · '+T('en_route');
  const ftag=document.getElementById('fTag');
  ftag.textContent=T('en_route'); ftag.className='tg tg-a';
  document.getElementById('fDist').textContent=task.dist||'–';
  document.getElementById('fEta').textContent=task.eta?task.eta[lang]:'–';
  const slaEl=document.getElementById('fSla');
  const slaText=task.sla==='overdue'?T('sla_overdue'):(task.sla?task.sla[lang]:'–');
  slaEl.textContent=slaText;
  slaEl.style.color=task.sla==='overdue'?'var(--r)':'var(--am)';
  // reset steps
  ['fs2','fs3','fs4','fs5'].forEach((id,i)=>{const n=document.getElementById(id);n.className='sn'+(i===0?' act':'');n.textContent=i+2;});
  document.querySelectorAll('#flowSteps .step').forEach((s,i)=>s.className='step'+(i===0?' done':''));
  // reset checkin
  const cb=document.getElementById('cinBtn');cb.className='cin-btn';
  document.getElementById('cinTxt').textContent=T('arrive_checkin');
  document.getElementById('cinSec').style.display='block';
  document.getElementById('workSec').style.display='none';
  // reset checklist
  document.querySelectorAll('#fclist .cli').forEach(c=>c.classList.remove('done'));
  document.getElementById('clProg').textContent='0/5';
  document.getElementById('progPct').textContent='0%';
  document.getElementById('progBar').style.width='0%';
  // reset photos
  document.getElementById('pgrid').innerHTML=`<div class="pthumb" onclick="addPhoto()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--g)" stroke-width="1.8" stroke-linecap="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="pnum">${T('photo_add')}</span></div>`;
  document.getElementById('photoCount').textContent='0/4';
  // reset anomaly
  document.getElementById('anomNote').value='';
  document.querySelectorAll('#anomChips .ac').forEach(c=>c.classList.remove('on'));
  // reset to nav mode (map fills screen, nav card floats over)
  const wrap=document.getElementById('flowMapWrap');
  wrap.classList.remove('work-mode');
  wrap.classList.add('nav-mode');
  document.getElementById('flowWorkBody').style.display='none';
  document.getElementById('flowNavCard').style.display='block';
  setFlowMapNavHeight();
  // render labels
  renderFlowLabels();
  renderAnomChips();
  document.getElementById('flowOverlay').classList.add('open');
  setTimeout(()=>{initFlowMap(task); openRouteOnMap(task);},150);
}

function closeFlow(){
  document.getElementById('flowOverlay').classList.remove('open');
}

function doCheckin(){
  if(checkinDone) return;
  checkinDone=true;
  const btn=document.getElementById('cinBtn');
  btn.className='cin-btn done';
  const time=new Date().toLocaleTimeString(lang==='zh'?'zh-TW':'en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('cinTxt').textContent=T('checkin_done',time);

  ftag.textContent=T('working'); ftag.className='tg tg-g';

function toggleCli(el){
  el.classList.toggle('done');
  flowCheckCount=document.querySelectorAll('#fclist .cli.done').length;
  const total=5;
  document.getElementById('clProg').textContent=flowCheckCount+'/'+total;
  const pct=Math.round(flowCheckCount/total*100);
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progBar').style.width=pct+'%';
  if(flowCheckCount===total){
    document.getElementById('fs4').className='sn done'; document.getElementById('fs4').textContent='✓';
    document.getElementById('fs5').className='sn act';
    document.querySelectorAll('#flowSteps .step')[3].classList.add('done');

function addPhoto(){
  if(flowPhotoCount>=4){toast(T('err_max'));return;}
  flowPhotoCount++;
  document.getElementById('photoCount').textContent=flowPhotoCount+'/4';
  const grid=document.getElementById('pgrid');
  const d=document.createElement('div');
  d.className='pthumb filled';
  d.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gd)" stroke-width="1.8" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg><span class="pnum">${T('photo_n',flowPhotoCount)}</span>`;
  grid.appendChild(d);
  toast(T('toast_photo',flowPhotoCount));

function submitFlow(){
  if(!checkinDone){toast(T('err_checkin'));return;}
  if(flowPhotoCount<1){toast(T('err_photo'));return;}
  const elapsed=startTime?Math.max(1,Math.round((new Date()-startTime)/60000)):18;
  document.getElementById('fs5').className='sn done'; document.getElementById('fs5').textContent='✓';
  document.querySelectorAll('#flowSteps .step')[4].classList.add('done');
  document.getElementById('flowOverlay').classList.remove('open');
  // show complete overlay
  const co=document.getElementById('coOverlay');
  document.getElementById('coTitle').textContent=T('complete');
  document.getElementById('coSub').textContent=T('synced')+'\n'+T('time_taken',elapsed);
  document.getElementById('coPts').textContent=T('pts');
  document.getElementById('coBtn').textContent=T('next_stop');
  co.classList.add('open');
}

function afterComplete(){
  document.getElementById('coOverlay').classList.remove('open');

}

async function openUrgRouteOnMap(task){
  try{
    await new Promise(resolve=>ensureInaviReady(resolve));
    const url=`https://gmaps.inavi.com/maps/v3.0/appkeys/${encodeURIComponent(INAVI_APP_KEY)}/route-normal-tw`;
    const body={startX:String(ME[1]),startY:String(ME[0]),endX:String(task.lng),endY:String(task.lat),traffic:1};
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const text=await res.text();
    let data; try{data=JSON.parse(text);}catch(e){return;}
    if(!res.ok) return;
    const coords=extractRouteCoordinates(data);
    if(!coords?.length) return;
    const points=coords.filter(c=>Array.isArray(c)&&Number.isFinite(Number(c[0]))&&Number.isFinite(Number(c[1]))).map(c=>[Number(c[0]),Number(c[1])]);
    if(!points.length) return;
    // remove existing dashed line and add solid route
    clearLayerRefs(mapLayers.urgent);
    mapLayers.urgent=[];
    mapLayers.urgent.push(addMarker(urgMapInst,toInaviCoord(ME),makeSmallMeIcon()));
    mapLayers.urgent.push(addMarker(urgMapInst,taskCoord(task),makeMapIcon(task),task.name[lang],true));
    const line=addPolyline(urgMapInst,points,'#ff4d4d',3,.9);
    mapLayers.urgent.push({line});
    fitMap(urgMapInst,points,15);
  }catch(err){console.log('urg route err',err);}
}

async function openRouteOnMap(task){
  const btn=document.getElementById('gmbBtn');
  const label=document.getElementById('gmbTxt');
  const oldText=label?.textContent||'';
  if(btn) btn.disabled=true;
  if(label) label.textContent=lang==='zh'?'規劃中...':'Routing...';

  try{
    await new Promise(resolve=>ensureInaviReady(resolve));
    if(!fMapInst) initFlowMap(task);

    const url=`https://gmaps.inavi.com/maps/v3.0/appkeys/${encodeURIComponent(INAVI_APP_KEY)}/route-normal-tw`;
    const body={
      startX:String(ME[1]),
      startY:String(ME[0]),
      endX:String(task.lng),
      endY:String(task.lat),
      traffic:1,
    };
    console.log(body)
    const res=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });
    console.log(res);
    const text=await res.text();
    let data;
    try{data=JSON.parse(text);}catch(e){data={__raw_response:text};}
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const coords=extractRouteCoordinates(data);
    if(!coords?.length) throw new Error('No route coordinates');
    const points=coords
      .filter(c=>Array.isArray(c)&&Number.isFinite(Number(c[0]))&&Number.isFinite(Number(c[1])))
      .map(c=>[Number(c[0]),Number(c[1])]);
    if(!points.length) throw new Error('No valid route coordinates');

    if(currentFlowLine?.setPath){
      currentFlowLine.setPath(points);
      currentFlowLine.setStyle?.(makeLineStyle('#ff4d4d',4,.9));
    }else{
      currentFlowLine=addPolyline(fMapInst,points,'#ff4d4d',4,.9);
      mapLayers.flow.push({line:currentFlowLine});
    }
    fitMap(fMapInst,points,15);

    const stats=extractRouteStats(data);
    if(stats.distance!=null) document.getElementById('fDist').textContent=(stats.distance/1000).toFixed(1)+'km';
    if(stats.spend_time!=null) document.getElementById('fEta').textContent=Math.max(1,Math.round(stats.spend_time/60))+(lang==='zh'?'分':'min');
    toast(T('toast_gmaps'));
  }catch(err){
    console.log(err);
    toast((lang==='zh'?'路線規劃失敗：':'Route failed: ')+err.message);
  }finally{
    if(btn) btn.disabled=false;
    if(label) label.textContent=oldText||T('gmaps');
  }
}

function switchPage(name){
  ['home','map','dash','profile'].forEach(p=>{
    document.getElementById('pg-'+p).style.display=p===name?'block':'none';
    document.getElementById('bn-'+p).classList.toggle('on',p===name);

  renderLang();
}
